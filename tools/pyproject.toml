[project]
name = "magazine-editor-tools"
version = "0.1.0"
description = "Developer scripts that drive magazine-editor through its MCP bridge (stress tests, templates)"
requires-python = ">=3.11"
dependencies = ["pillow>=11"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
