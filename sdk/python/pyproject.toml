[project]
name = "magazine-sdk"
version = "0.1.0"
description = "Python SDK that drives magazine-editor (雜誌編輯軟體) through its MCP bridge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "magazine"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
